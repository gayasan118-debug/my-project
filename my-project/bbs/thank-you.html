<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감사합니다</title>
<link rel="stylesheet" href="../css/default.css">
<link rel="stylesheet" href="../css/layout.css">
<style>
    .thank-you-container {
        text-align: center;
        padding: 120px 20px;
    }
    .thank-you-container h1 {
        font-size: 2.5em;
        font-weight: 600;
        color: #333;
    }
    .thank-you-container p {
        font-size: 1.2em;
        margin-top: 20px;
        color: #555;
    }
    .thank-you-container .home-button {
        display: inline-block;
        margin-top: 50px;
        padding: 15px 40px;
        background-color: #004B9A;
        color: #fff;
        text-decoration: none;
        font-size: 1.1em;
        border-radius: 5px;
        transition: background-color 0.3s;
    }
    .thank-you-container .home-button:hover {
        background-color: #003366;
    }
</style>
</head>
<body>
<div class="wrap">
    <header class="sub">
        <div class="header-inner">
			<h1 class="logo">
				<a href="../index.htm"><img src="../images/logo.png" alt="로고"></a>
			</h1>
		</div>
	</header>
    <div class="thank-you-container">
        <h1>제출이 완료되었습니다.</h1>
        <p>관심고객으로 등록해 주셔서 감사합니다.</p>
        <a href="../index.htm" class="home-button">홈으로 돌아가기</a>
    </div>
    <footer>
        <div class="f_inner">
            <div class="left_box">
                <div class="f_logo"><img src="../images/f_logo.png" alt="로고이미지"></div>
                <div class="f_copy">
                    <p>Copyright©2025 오정 해모로 스마트시티 . All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>
</div>
</body>
</html>
